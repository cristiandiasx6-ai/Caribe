/* ============================================================
   CARIBE · lógica de la app
   ============================================================ */
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nowTime = () => new Date().toLocaleTimeString('es-DO', { hour: '2-digit', minute: '2-digit', hour12: false });
const fmtNum = n => n >= 1000 ? (n/1000).toFixed(1).replace(/\.0$/,'') + 'K' : String(n);
const fmtRD  = n => 'RD$' + Number(n).toLocaleString('es-DO');
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

/* ---------- Audio (WebAudio, lazy) ---------- */
let AC = null;
const soundOn = () => !!(state && state.sounds);
function ac(){ if(!AC){ try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ AC = null; } } return AC; }
function tone(freq, dur=0.09, type='sine', gain=0.06, when=0){
  if(!soundOn()) return;
  const ctx = ac(); if(!ctx) return;
  try{
    const t0 = ctx.currentTime + when;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }catch(e){}
}
const sndSend    = () => tone(880, .09, 'triangle', .055);
const sndReceive = () => { tone(523.25, .12, 'sine', .06); tone(784, .16, 'sine', .055, .11); };
const sndPop     = () => tone(1250, .06, 'square', .035);
const sndKey     = f => tone(f, .09, 'sine', .05);

/* ============================================================
   DATOS
   ============================================================ */
const TICK = '<svg width="15" height="11" viewBox="0 0 16 12" fill="none"><path d="M1 6.3 4.6 10 11 2.4" stroke="#53bdeb" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M6.4 8.4 8.4 10.4 15 2.4" stroke="#53bdeb" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const CHECK_V = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4.5 4.5L19 8"/></svg>';








const CITIES = ['Toda República Dominicana','Santo Domingo','Santiago','La Vega','San Pedro de Macorís','La Romana','Bávaro / Punta Cana','San Cristóbal'];



/* Inventario de prueba: la app arranca vacía — todo llega del servidor o del usuario */
const BUSINESSES = [];   // negocios reales aparecerán cuando sus dueños se unan
const ORDERS = [];       // pedidos locales del usuario
const state = {
  chats: [],
  statuses: [],
  vibra: [],
  calls: [],
  products: [],
  favorites: new Set(),
  bizFilter: 'all', chatFilter: 'all', marketFilter: 'all',
  marketQuery: '', bizQuery: '', chatQuery: '', sort: 'recent', loc: CITIES[0],
  currentChatId: null, currentBizId: null, currentProduct: null,
  storyIndex: 0, storyTimer: null, storyProgressTimer: null, storyViewersTimer: null, storyCommentTimer: null,
  liveTimer: null, liveViewersTimer: null, liveCommentTimer: null, liveHeartTimer: null, liveSeconds: 0,
  callTimer: null, callSeconds: 0, callPeer: null, callVideo: false, callMuted: false, callSpeaker: false, callConnected: false,
  sounds: true, dark: false, notifications: true, enterToSend: false,
  orderAdds: 0, recording: false, recTimer: null, recSeconds: 0,
  pushed: false, incomingShown: false, myStatus: null
};
try{ const t = localStorage.getItem('caribe-theme'); if(t === 'dark'){ state.dark = true; } }catch(e){}

/* normalizar semillas: las burbujas usan m.text */
state.chats.forEach(c => (c.msgs || []).forEach(m => { if(m.text == null && m.t != null) m.text = m.t; }));

/* ============================================================
   TABS
   ============================================================ */
const SB_DARK_PAGES = ['page-vibra']; // páginas con fondo oscuro → barra de estado blanca
function setStatusbarMode(pageId){ $('#screen').classList.toggle('sb-light', SB_DARK_PAGES.includes(pageId)); }
function switchTab(pageId){
  $$('.tab').forEach(t => t.classList.toggle('active', t.dataset.page === pageId));
  $$('.page').forEach(p => p.classList.toggle('active', p.id === pageId));
  setStatusbarMode(pageId);
  if(pageId === 'page-vibra'){ setTimeout(() => $('#vibraFeed').scrollTo({top: 0}), 30); }
}
$('#tabbar').addEventListener('click', e => {
  const btn = e.target.closest('.tab'); if(!btn) return;
  switchTab(btn.dataset.page);
});

/* ============================================================
   TOAST + PUSH
   ============================================================ */
let toastTimer = null;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}
function pushBanner(name, text, onTap){
  if(!state.notifications) return;
  $('#pushName').textContent = name; $('#pushText').textContent = text;
  const push = $('#pushBanner');
  push.onclick = () => { push.classList.remove('show'); if(onTap) onTap(); };
  push.classList.add('show');
  sndReceive();
  setTimeout(() => push.classList.remove('show'), 5200);
}

/* ============================================================
   CHATS — lista
   ============================================================ */
function chatMatches(c, filter, q){
  if(filter === 'unread' && !(c.unread > 0)) return false;
  if(filter === 'group'  && c.kind !== 'group') return false;
  if(filter === 'business' && c.kind !== 'business') return false;
  if(q){ const hay = (c.name + ' ' + c.preview).toLowerCase(); if(!hay.includes(q)) return false; }
  return true;
}
function renderChats(){
  const q = state.chatQuery.trim().toLowerCase();
  const list = state.chats.filter(c => chatMatches(c, state.chatFilter, q));
  const el = $('#chatList');
  if(!list.length){ updateTabBadge(); el.innerHTML = '<div style="text-align:center;padding:46px 24px;color:var(--muted);font-size:13px;line-height:1.7">Aún no tienes chats 🌴<br><span style="font-size:12px">Toca el botón verde abajo a la derecha para buscar a tus amigos por nombre o número.</span></div>'; return; }
  el.innerHTML = list.map(c => {
    const ticks = c.out ? TICK + ' ' : '';
    const ia = c.ia ? '<span class="ia-badge">IA</span>' : '';
    const verified = c.verified ? '<span class="vcheck">' + CHECK_V + '</span>' : '';
    const online = c.online ? '<span class="dot"></span>' : '';
    const style = (c.avatar.c && c.avatar.c.includes('gradient')) ? 'background:' + c.avatar.c : 'background:' + c.avatar.c;
    const avatarTxt = c.avatar.dark ? '<span style="color:#3f2d12">' + esc(c.avatar.t) + '</span>' : esc(c.avatar.t);
    const preview = esc(c.preview);

function bubbleHTML(m, idx){

  }
  if(m.contact){

/* ---------- Panel de grabación de voz (image-72) ---------- */
const VP_BARS = 56;
const vpAmps = new Array(VP_BARS).fill(0.15);
let vpWaveTimer = null;
function vpBuildWave(){
  const wave = $('#vpWave'); if(!wave || wave.childElementCount) return;
  wave.innerHTML = '<span class="vp-bar"></span>'.repeat(VP_BARS);
}
function vpFmt(s){ return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function vpUpdate(){
  const s = state.recSeconds;
  $('#vpTime').textContent = vpFmt(s);
  $('#vpRingNum').textContent = String(s);
  const C = 2 * Math.PI * 16;
  const frac = (s % 60) / 60;
  $('#vpRingFg').style.strokeDashoffset = String(C * (1 - frac));
}
function vpWaveTick(){
  if(state.recPaused) return;
  const now = Date.now();
  const bars = $('#vpWave').children;
  if(recAnalyser && recFreq){
    recAnalyser.getByteFrequencyData(recFreq);
    for(let i = 0; i < VP_BARS; i++){
      const bin = Math.floor(Math.pow(i / VP_BARS, 1.35) * (recFreq.length * 0.72));
      const v = (recFreq[bin] || 0) / 255;
      vpAmps[i] += (Math.max(0.05, v) - vpAmps[i]) * 0.55;
      const env = Math.pow(Math.sin(Math.PI * (i + 1) / (VP_BARS + 1)), 1.1);
      bars[i].style.height = Math.round(4 + vpAmps[i] * env * 52) + 'px';
    }
    return;
  }
  for(let i = 0; i < VP_BARS; i++){
    vpAmps[i] += (Math.random() - 0.5) * 0.34;
    vpAmps[i] = Math.min(1, Math.max(0.06, vpAmps[i]));
    const env = Math.pow(Math.sin(Math.PI * (i + 1) / (VP_BARS + 1)), 1.15);
    const wob = 1 + 0.38 * Math.sin(now / 260 + i * 0.55);
    const h = Math.round(4 + vpAmps[i] * env * wob * 50);
    bars[i].style.height = h + 'px';
  }
}
function vpReset(){
  state.recPaused = false;
  state.recSeconds = 0;
  vpAmps.fill(0.15);
  vpBuildWave();
  $$('#vpWave .vp-bar').forEach(b => b.style.height = '4px');
  const panel = $('#voicePanel'); panel.classList.remove('paused');
  $('#vpPauseBtn').setAttribute('aria-pressed', 'false');
  $('#vpPauseLbl').textContent = 'Pausar';
  $('#vpPauseIcon').innerHTML = '<rect x="6.6" y="5" width="3.8" height="14" rx="1.4"/><rect x="13.6" y="5" width="3.8" height="14" rx="1.4"/>';
  vpUpdate();
}
function vpClose(){
  clearInterval(state.recTimer); state.recTimer = null;
  clearInterval(vpWaveTimer); vpWaveTimer = null;
  $('#voicePanel').hidden = true;
  const comp = $('.composer'); if(comp) comp.style.display = '';
  state.recording = false;
}
let mediaRec = null, recStream = null, recChunks = [], audioCtxRec = null, recAnalyser = null, recFreq = null, recMime = '', recDeliver = null;
function recStopTracks(){
  if(recStream){ recStream.getTracks().forEach(t => { try{ t.stop(); }catch(_){} }); recStream = null; }
  if(audioCtxRec){ try{ audioCtxRec.close(); }catch(_){} audioCtxRec = null; }
  recAnalyser = null; recFreq = null;
}
function armRecTimers(){
  vpWaveTimer = setInterval(vpWaveTick, 85);
  state.recTimer = setInterval(() => {
    if(state.recPaused) return;
    state.recSeconds++;
    if(state.recSeconds >= 60){ stopRecording(true); return; }
    vpUpdate();
  }, 1000);
}
function toggleRecording(){
  if(state.recording){ stopRecording(false); return; }   // toca de nuevo = enviar
  state.recording = true;
  vpReset();
  $('.composer').style.display = 'none';
  $('#voicePanel').hidden = false;
  sndPop();
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder){
    armRecTimers();   // navegador sin soporte: animación sin audio
    return;
  }
  navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }).then(stream => {
    if(!state.recording){ stream.getTracks().forEach(t => { try{ t.stop(); }catch(_){} }); return; }
    recStream = stream;
    recChunks = [];
    try{
      recMime = (window.MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) ? 'audio/webm;codecs=opus' : '';
      mediaRec = recMime ? new MediaRecorder(stream, { mimeType: recMime }) : new MediaRecorder(stream);
    }catch(e){ try{ mediaRec = new MediaRecorder(stream); }catch(_){ mediaRec = null; } }
    if(mediaRec){
      mediaRec.ondataavailable = e => { if(e.data && e.data.size) recChunks.push(e.data); };
      mediaRec.onstop = () => {
        recStopTracks();
        const deliver = recDeliver; recDeliver = null;
        if(deliver) deliver();
      };
      try{ mediaRec.start(250); }catch(_){}
    }
    try{
      audioCtxRec = new (window.AudioContext || window.webkitAudioContext)();
      const node = audioCtxRec.createMediaStreamSource(stream);
      recAnalyser = audioCtxRec.createAnalyser();
      recAnalyser.fftSize = 256;
      recAnalyser.smoothingTimeConstant = 0.8;
      recFreq = new Uint8Array(recAnalyser.frequencyBinCount);
      node.connect(recAnalyser);
    }catch(_){ recAnalyser = null; }
    armRecTimers();
  }).catch(() => {
    vpClose();
    state.recording = false;
    toast('Sin permiso de micrófono 🎙️ — actívalo en los ajustes del navegador');
  });
}
function deliverRecordedAudio(chat, secs, auto, mime){
  mime = mime || recMime || 'audio/webm';
  const blob = new Blob(recChunks, { type: mime });
  recChunks = [];
  const reader = new FileReader();
  reader.onload = () => {
    const src = reader.result;
    appendMessage(chat, { d:'out', audio:true, dur: secs, src, text:'🎤 Audio', time: nowTime() });
    sndSend();
    if(chat.kind === 'online' && onlineMe) onlineSendMessage({ to: chat.userId, kind: 'audio', payload: src, dur: secs });
    toast(auto ? '⏱️ 60 s — audio enviado' : '🎤 Audio enviado');
  };
  reader.readAsDataURL(blob);
}
function stopRecording(auto){
  const chat = getChat(state.currentChatId);
  const secs = state.recSeconds;
  const keep = secs >= 1 && !!chat;
  vpClose();
  if(mediaRec){
    const savedMime = (mediaRec && mediaRec.mimeType) || recMime;
    recDeliver = keep ? () => deliverRecordedAudio(chat, secs, auto, savedMime) : null;
    try{
      if(mediaRec.state !== 'inactive') mediaRec.stop();
      else { recStopTracks(); const d = recDeliver; recDeliver = null; if(d) d(); }
    }catch(e){ recDeliver = null; recStopTracks(); }
    mediaRec = null;
  } else {
    recStopTracks();
    if(keep){
      appendMessage(chat, { d:'out', audio:true, dur: secs, text:'🎤 Audio', time: nowTime() });
      sndSend();
      toast(auto ? '⏱️ 60 s — audio enviado' : '🎤 Audio enviado');
    }
  }
  if(!keep) state.recSeconds = 0;
}
function cancelRecording(){
  vpClose();
  if(mediaRec){
    recDeliver = null;
    try{
      if(mediaRec.state !== 'inactive') mediaRec.stop(); else recStopTracks();
    }catch(e){ recStopTracks(); }
    mediaRec = null;
  } else recStopTracks();
  recChunks = [];
  state.recSeconds = 0;
  sndPop();
  toast('Grabación descartada 🗑️');
}
$('#vpSendBtn').addEventListener('click', () => stopRecording(false));
$('#vpCancelBtn').addEventListener('click', cancelRecording);
$('#vpPauseBtn').addEventListener('click', () => {

    : '<rect x="6.6" y="5" width="3.8" height="14" rx="1.4"/><rect x="13.6" y="5" width="3.8" height="14" rx="1.4"/>';

function renderStoryComments(s){
  const box = $('#storyComments');
  const list = (s.comments || []).slice(-6);
  const F = [0.3, 0.4, 0.52, 0.65, 0.82, 1];

/* ---------- descargar el estado (PNG real vía canvas) ---------- */
function storyGradientColors(s){
  return (String(s.grad).match(/#[0-9a-fA-F]{3,8}|rgba?\([^)]+\)/g) || ['#ec4899', '#be185d']);
}
function wrapCanvasText(ctx, text, maxW){
  const words = String(text).split(/\s+/);
  const lines = []; let line = '';
  for(const w of words){
    const t = line ? line + ' ' + w : w;
    if(ctx.measureText(t).width > maxW && line){ lines.push(line); line = w; } else { line = t; }
  }
  if(line) lines.push(line);
  return lines;
}
function downloadStory(){
  const s = state.statuses[state.storyIndex]; if(!s) return;
  try{
    const W = 1080, H = 1920;
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const x = c.getContext('2d');
    // fondo degradado del estado
    const cols = storyGradientColors(s);
    const g = x.createLinearGradient(0, 0, W * 0.4, H);
    cols.forEach((col, i) => g.addColorStop(cols.length === 1 ? 0 : i / (cols.length - 1), col));
    x.fillStyle = g; x.fillRect(0, 0, W, H);
    // círculos decorativos sutiles
    x.fillStyle = 'rgba(255,255,255,0.10)';
    [[W * 0.85, H * 0.16, 250], [W * 0.12, H * 0.72, 195], [W * 0.80, H * 0.85, 115]].forEach(([cx, cy, r]) => {
      x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); x.fill();
    });
    // encabezado: avatar + nombre + hora + vistas
    const avColor = (String(s.avatar.c || '#ffffff').match(/#[0-9a-fA-F]{3,8}|rgba?\([^)]+\)/) || ['#ffffff'])[0];
    x.beginPath(); x.arc(96, 148, 54, 0, Math.PI * 2);
    x.fillStyle = avColor; x.fill();
    x.lineWidth = 5; x.strokeStyle = 'rgba(255,255,255,.9)'; x.stroke();
    const avTxt = String(s.avatar.dark ? '🍗' : (s.avatar.t || '?'));
    x.textAlign = 'center'; x.textBaseline = 'middle';
    x.font = avTxt.length > 2 ? '46px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif' : '800 44px -apple-system, "Segoe UI", Roboto, sans-serif';
    x.fillStyle = s.avatar.dark ? '#3f2d12' : '#ffffff';
    x.fillText(avTxt, 96, 152);
    x.textAlign = 'left'; x.textBaseline = 'alphabetic';
    x.shadowColor = 'rgba(0,0,0,.35)'; x.shadowBlur = 10;
    x.fillStyle = '#fff';
    x.font = '800 46px -apple-system, "Segoe UI", Roboto, sans-serif';
    x.fillText(s.name, 172, 140);
    x.globalAlpha = .92;
    x.font = '400 32px -apple-system, "Segoe UI", Roboto, sans-serif';
    x.fillText(s.time + '  ·  👁 ' + (s.viewers || 12), 172, 190);
    x.globalAlpha = 1;
    // emoji grande flotante
    x.textAlign = 'center';
    x.font = '235px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    x.shadowBlur = 40;
    x.fillText(s.emoji, W / 2, H * 0.41);
    // texto principal (con ajuste de línea)
    x.font = '800 66px -apple-system, "Segoe UI", Roboto, sans-serif';
    x.shadowBlur = 26;
    const lines = wrapCanvasText(x, s.text, W - 170);
    const lh = 88;
    let ty = H * 0.575;
    if(lines.length > 2) ty = H * 0.545;
    for(const ln of lines){ x.fillText(ln, W / 2, ty); ty += lh; }
    x.shadowBlur = 0;
    // marca de agua Caribe
    x.font = '700 34px -apple-system, "Segoe UI", Roboto, sans-serif';
    x.fillStyle = 'rgba(255,255,255,.9)';
    x.fillText('Caribe 🌴 · la super app del Caribe', W / 2, H - 132);
    c.toBlob(b => {
      if(!b){ toast('No se pudo generar la imagen 😔'); return; }
      const url = URL.createObjectURL(b);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'caribe-estado-' + (s.id || 'story') + '.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      toast('Estado descargado ⬇️');
      sndPop();
    }, 'image/png');
  }catch(e){ toast('No se pudo descargar 😔'); }
}

function filterCss(f, k){
  if(!f || !f.p) return '';
  const p = f.p, L = (a, b) => (a + (b - a) * k).toFixed(3), parts = [];
  parts.push('brightness(' + L(1, p.b == null ? 1 : p.b) + ')');

  parts.push('contrast(' + L(1, p.c == null ? 1 : p.c) + ')');
  if(p.sepia) parts.push('sepia(' + (p.sepia * k).toFixed(3) + ')');
  if(p.gray) parts.push('grayscale(' + (p.gray * k).toFixed(3) + ')');
  if(p.hue) parts.push('hue-rotate(' + Math.round(p.hue * k) + 'deg)');

let drawing = false, lastPt = null;
function drawPos(e){ const r = drawCanvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
drawCanvas.addEventListener('pointerdown', e => { if(!drawOn) return; drawing = true; lastPt = drawPos(e); try{ drawCanvas.setPointerCapture(e.pointerId); }catch(_){} });
drawCanvas.addEventListener('pointermove', e => {

  ctx.beginPath(); ctx.moveTo(lastPt.x, lastPt.y); ctx.lineTo(p.x, p.y); ctx.stroke();

      state.vibra.forEach(x => { if(x.userId === v.userId) x.following = v.following; });

    }

    if(fp){ if(v.following) follows.add(fp.id); else follows.delete(fp.id); saveFollows(); }
    btn.classList.toggle('done', v.following); btn.innerHTML = v.following ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4.5 4.5L19 8"/></svg>' : '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>'; toast(v.following ? 'Siguiendo a ' + v.handle + ' ✅' : 'Has dejado de seguir a ' + v.handle); }
  else if(act === 'comment'){ openComments(v); }
  else if(act === 'buy'){ if(v.product){ sndPop(); showProduct(vibraProductOf(v)); } }

  else if(act === 'save'){ v.saved = !v.saved; if(v.srv){ if(v.saved) vibraSaved.add(v.id); else vibraSaved.delete(v.id); } btn.classList.toggle('saved', v.saved); toast(v.saved ? 'Guardado en tus favoritos 🔖' : 'Eliminado de guardados'); }
  else if(act === 'share'){ const v = state.vibra.find(x => x.id === currentVibraId); shareCaptionCache = v ? (v.caption || '').replace(/<[^>]+>/g, '').slice(0, 90) : 'Vibra de Caribe'; renderShareGrid(); openSheet('sheetShare'); }
});
function toggleVibraLike(slide, v, btn){
  v.liked = !v.liked; v.likes += v.liked ? 1 : -1;
  slide.querySelector('.like-btn').classList.toggle('liked', v.liked);
  slide.querySelector('.like-count').textContent = fmtNum(v.likes);
  if(v.liked){ sndPop(); burstHearts(slide, 1, '❤️'); }
  if(v.srv && onlineMe){
    const want = v.liked;
    onlineApi('/posts/' + v.id + '/like', { method: 'POST', body: JSON.stringify({ on: want }) })
      .then(r => { v.liked = r.liked; v.likes = r.likes; slide.querySelector('.like-btn').classList.toggle('liked', v.liked); slide.querySelector('.like-count').textContent = fmtNum(v.likes); })
      .catch(() => { v.liked = !want; v.likes += want ? -1 : 1; slide.querySelector('.like-btn').classList.toggle('liked', v.liked); slide.querySelector('.like-count').textContent = fmtNum(v.likes); toast('No se pudo guardar tu me gusta 😕'); });
  }
}
function burstHearts(container, n, emoji){
  for(let i = 0; i < n; i++){
    const h = document.createElement('div');
    h.className = 'big-heart'; h.textContent = emoji || '❤️';
    h.style.left = (58 + Math.random() * 26) + '%';
    h.style.top = (52 + Math.random() * 18) + '%';
    h.style.fontSize = (40 + Math.random() * 26) + 'px';
    h.style.animationDelay = (Math.random() * 0.18) + 's';
    container.appendChild(h);
    setTimeout(() => h.remove(), 900);
  }
}

$('#vibraFeed').addEventListener('dblclick', e => {

$('#vibraFeed').addEventListener('touchend', e => {

function openComments(v){

  onlineApi('/posts/' + v.id + '/comments').then(r => {

      : '<div class="reg-empty" style="padding:14px">Sé la primera persona en comentar 💬</div>';

$('#sendCommentBtn').addEventListener('click', sendComment);

async function sendComment(){
  const input = $('#commentInput'); const val = input.value.trim(); if(!val) return;
  const id = +input.dataset.vibraId || currentVibraId;
  const vb = state.vibra.find(x => x.id === id); if(!vb) return;
  const list = $('#commentsList');
  if(vb.srv && onlineMe){
    input.value = '';
    try{
      const r = await onlineApi('/posts/' + id + '/comments', { method: 'POST', body: JSON.stringify({ text: val }) });
      vb.comments = r.comments;
      const empty = list.querySelector('.reg-empty'); if(empty) empty.remove();
      list.insertAdjacentHTML('afterbegin', commentRowHTML(onlineMe.name, r.comment.text, 'ahora', true));
      sndSend();
    }catch(err){ input.value = val; toast('No se pudo comentar 😕 ' + (err.message || '')); return; }
  } else {
    vb.comments++;
    list.insertAdjacentHTML('afterbegin', commentRowHTML('tú', val, 'ahora', true));
    input.value = ''; sndSend();
  }
  $('#commentsTitle').textContent = fmtNum(vb.comments) + ' comentarios';
  $$('.comment-count').forEach(n => { const sl = n.closest('.slide'); if(sl && +sl.dataset.vibra === id) n.textContent = fmtNum(vb.comments); });
}

function productMatches(p){
  if(state.marketFilter === 'vehiculos' && p.cat !== 'vehiculos') return false;
  if(state.marketFilter === 'alquiler' && p.cat !== 'alquiler') return false;
  if(state.marketQuery){ const hay = (p.title + ' ' + p.loc).toLowerCase(); if(!hay.includes(state.marketQuery)) return false; }
  return true;
}
function renderMarket(){
  let list = state.products.filter(productMatches);
  if(state.sort === 'price-asc') list = list.slice().sort((a,b) => a.price - b.price);
  else if(state.sort === 'price-desc') list = list.slice().sort((a,b) => b.price - a.price);
  $('#selCount').textContent = list.length;
  $('#marketCountNote').textContent = state.marketQuery ? 'Resultados para “' + state.marketQuery + '”' : '';
  const grid = $('#marketGrid');
  if(!list.length){ grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:36px 16px;color:var(--muted);font-size:13px;line-height:1.7">' + (state.products.length ? 'Sin resultados para tu búsqueda 🫥<br><span style="font-size:11px">Intenta con otro término o categoría.</span>' : 'Aún no hay publicaciones en el Market 🛍️<br><span style="font-size:11px">Sé la primera persona en vender algo.</span>') + '</div>'; return; }
  grid.innerHTML = list.map(p => {
    const fav = state.favorites.has(p.id);
    const thumb = p.img
      ? '<img src="' + p.img + '" alt="' + esc(p.title) + '" onerror="this.remove()">'
      : '';
    return '<button class="mk-card" data-product="' + p.id + '">'
      + '<div class="mk-thumb" style="--g1:' + p.g[0] + ';--g2:' + p.g[1] + '">' + thumb + '<span style="position:absolute;z-index:1">' + p.emoji + '</span>'
      + '<span class="fav-btn' + (fav ? ' on' : '') + '" data-fav="' + p.id + '" role="button" aria-label="Me gusta"><svg width="17" height="17" viewBox="0 0 24 24" fill="' + (fav ? '#e11d48' : 'none') + '" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.7 4.5 13.3a5.35 5.35 0 0 1 0-7.6 5.3 5.3 0 0 1 7.5 0l.0.1.0-.1a5.3 5.3 0 0 1 7.5 0 5.35 5.35 0 0 1 0 7.6L12 20.7Z"/></svg></span>'
      + (p.isNew ? '<span class="new-ribbon">NUEVO</span>' : '')
      + '</div>'
      + '<div class="mk-body"><div class="mk-price">' + fmtRD(p.price) + (p.suffix ? '<span style="font-size:11px;font-weight:600;color:var(--muted)">' + p.suffix + '</span>' : '') + '</div>'
      + '<div class="mk-title">' + esc(p.title) + '</div>'
      + '<div class="mk-loc"><svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7.5 7.5 0 0 0-7.5 7.5c0 5.2 6.5 12.2 6.8 12.5a1 1 0 0 0 1.4 0c.3-.3 6.8-7.3 6.8-12.5A7.5 7.5 0 0 0 12 2Z"/></svg>' + esc(p.loc) + '</div>'
      + '</div></button>';
  }).join('');
}

  return { html: esc((words[0][0] || '?') + (words[1] ? words[1][0] : '')).toUpperCase(), bg:'#546e7a' };
}

/* ----- quien transmite ----- */
async function openLive(){
  if(!onlineMe || !onlineMe.token){ toast('Regístrate primero para transmitir 🙏'); return; }
  if(live.role){ toast('Ya estás en un live'); return; }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ toast('Para transmitir hace falta abrir la app con HTTPS 🔒'); return; }
  const title = (($('#liveTitleInput') && $('#liveTitleInput').value) || '').trim();
  let stream;
  try{ stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 720 }, height: { ideal: 1280 } }, audio: true }); }
  catch(_){ toast('Necesito permiso de cámara y micrófono para transmitir 📷'); return; }
  try{ const r = await onlineApi('/live/start', { method: 'POST', body: JSON.stringify({ title }) }); if(r.ice) live.ice = r.ice; }
  catch(err){ stream.getTracks().forEach(t => t.stop()); toast('No se pudo iniciar el live 😕 ' + (err.message || '')); return; }
  live.role = 'host'; live.hostId = onlineMe.id; live.stream = stream;
  liveOpenScreen({ name: 'Tú', avatarText: 'TÚ', avatarColor: '#0da271', meta: '@' + slugify(onlineMe.name) + ' · ' + (title || 'En vivo'), big: title || '¡Estoy en vivo!', viewers: 0, host: true });
  const v = $('#liveVideo'); v.srcObject = stream; v.muted = true; v.play().catch(() => {});
  $('#liveScreen').classList.add('has-video', 'mirror');
}
async function hostConnectViewer(peerId, name){
  if(live.role !== 'host' || !live.stream) return;
  const old = live.pcs.get(peerId); if(old) try{ old.close(); }catch(_){}
  const pc = new RTCPeerConnection({ iceServers: live.ice }); pc._q = [];
  live.stream.getTracks().forEach(t => pc.addTrack(t, live.stream));
  pc.onicecandidate = e => { if(e.candidate) liveSig(peerId, 'ice', e.candidate.toJSON()); };
  live.pcs.set(peerId, pc);
  const offer = await pc.createOffer(); await pc.setLocalDescription(offer);
  liveSig(peerId, 'offer', sdpOf(pc.localDescription));
  addLiveComment('Caribe', '#0d9488', (name || 'Alguien') + ' se unió 👋');
}
function hostDropViewer(peerId){ const pc = live.pcs.get(peerId); if(pc){ try{ pc.close(); }catch(_){} live.pcs.delete(peerId); } }

/* ----- quien mira ----- */
async function watchLive(hostId){
  if(live.role){ toast('Ya estás en un live'); return; }
  let r;
  try{ r = await onlineApi('/live/' + hostId + '/join', { method: 'POST', body: '{}' }); }
  catch(err){ toast(err.message || 'No se pudo entrar al live'); refreshLiveNow(); return; }
  if(r.ice) live.ice = r.ice;
  live.role = 'viewer'; live.hostId = hostId;
  liveOpenScreen({ name: r.name, avatarText: initialsOf(r.name), avatarColor: colorForId(hostId), meta: '@' + slugify(r.name) + (r.title ? ' · ' + r.title : ''), big: 'Conectando…', viewers: r.viewers, host: false });
  clearTimeout(live.connTimer);
  live.connTimer = setTimeout(() => { if(live.role === 'viewer' && !$('#liveScreen').classList.contains('has-video')) $('#liveBigText').textContent = 'No carga el video 😕 Puede que tu red bloquee la conexión directa.'; }, 15000);
}
async function viewerAnswer(offer){
  if(live.pc) try{ live.pc.close(); }catch(_){}
  const pc = new RTCPeerConnection({ iceServers: live.ice }); pc._q = []; live.pc = pc;
  pc.ontrack = e => {
    const v = $('#liveVideo'); v.srcObject = e.streams[0]; v.muted = false;
    v.play().catch(() => { v.muted = true; v.play().catch(() => {}); toast('Toca la pantalla para activar el sonido 🔊'); });
    $('#liveScreen').classList.add('has-video'); clearTimeout(live.connTimer);
  };
  pc.onicecandidate = e => { if(e.candidate) liveSig(live.hostId, 'ice', e.candidate.toJSON()); };
  await pc.setRemoteDescription(offer);
  for(const c of pc._q.splice(0)) pc.addIceCandidate(c).catch(() => {});
  const ans = await pc.createAnswer(); await pc.setLocalDescription(ans);
  liveSig(live.hostId, 'answer', sdpOf(pc.localDescription));
}

/* ----- señales y eventos del servidor ----- */
async function handleLiveSignal(m){
  if(!live.role || !m) return;
  try{
    if(live.role === 'host'){
      if(m.kind === 'join') await hostConnectViewer(m.from, m.name);
      else if(m.kind === 'leave') hostDropViewer(m.from);
      else if(m.kind === 'answer'){ const pc = live.pcs.get(m.from); if(pc){ await pc.setRemoteDescription(m.data); for(const c of pc._q.splice(0)) pc.addIceCandidate(c).catch(() => {}); } }
      else if(m.kind === 'ice'){ const pc = live.pcs.get(m.from); if(pc){ if(pc.remoteDescription) pc.addIceCandidate(m.data).catch(() => {}); else pc._q.push(m.data); } }
    } else if(m.from === live.hostId){
      if(m.kind === 'offer') await viewerAnswer(m.data);
      else if(m.kind === 'ice' && live.pc){ if(live.pc.remoteDescription) live.pc.addIceCandidate(m.data).catch(() => {}); else live.pc._q.push(m.data); }
    }
  }catch(_){ /* una conexión fallida no debe tumbar el live de los demás */ }
}
function handleLiveEvent(m){
  if(!m) return;
  if(m.type === 'start'){ refreshLiveNow(); toast('🔴 ' + m.name + ' está en vivo'); }
  else if(m.type === 'end'){
    if(live.role === 'viewer' && live.hostId === m.hostId){ toast('La transmisión terminó 🎬'); leaveLive(); }
    else refreshLiveNow();
  }
  else if(m.type === 'viewers' && live.role && live.hostId === m.hostId){ $('#liveViewers').textContent = String(m.count); }
}
async function refreshLiveNow(){
  const box = $('#liveNowList'); if(!box || !onlineMe || !onlineMe.token) return;
  try{
    const r = await onlineApi('/live');
    if(r.ice) live.ice = r.ice;
    live.lives = (r.lives || []).filter(l => l.hostId !== onlineMe.id);
    box.innerHTML = live.lives.map(l =>
      '<button class="live-now" data-host="' + esc(l.hostId) + '"><span style="font-size:22px">🔴</span><div><b>' + esc(l.name) + ' está en vivo</b><small>'
      + esc(l.title || 'Toca para ver') + ' · ' + l.viewers + ' viendo</small></div><span class="live-go">Ver</span></button>').join('');
  }catch(_){}
}

/* ========== Lentes AR · Snap Camera Kit Web (OPCIONAL: requiere internet + tus credenciales) ========== */
const AR_KEY = 'caribe-snap-kit';
let arSdk = null, arStream = null, arSession = null, arLive = false;
function arStatus(msg, kind){
  const el = $('#arStatus');
  el.textContent = msg;
  el.className = 'ar-status' + (kind ? ' ' + kind : '');
}
function arSetLiveUI(on){
  arLive = on;
  $('#arStopBtn').hidden = !on;
  $('#arStartBtn').hidden = on;
  $('#creatorSceneBg').style.visibility = on ? 'hidden' : '';
  $('#creatorSceneEmoji').style.visibility = on ? 'hidden' : '';
  $('#creatorFxOverlay').style.visibility = on ? 'hidden' : '';
  $('#arCanvas').hidden = !on;
}
async function stopSnapAR(silent){
  try{ if(arSession && arSession.pause) await arSession.pause(); }catch(_){}
  try{ if(arSession && arSession.destroy) await arSession.destroy(); }catch(_){}
  if(arStream){ arStream.getTracks().forEach(t => t.stop()); arStream = null; }
  arSession = null;
  arSetLiveUI(false);
  if(!silent){ arStatus('⚪ AR detenido — volviste a la cámara simulada.', ''); toast('Lentes AR detenidos'); }
}
async function startSnapAR(){
  const token = $('#arToken').value.trim(), group = $('#arGroup').value.trim(), lensId = $('#arLensId').value.trim();
  if(!token || !group){
    arStatus('⚠️ Pega tu API Token y tu Lens Group ID primero.', 'err');
    toast('Faltan credenciales de Snap 🔑');
    return;
  }
  if(!navigator.onLine){
    arStatus('📵 Sin conexión — Snap Camera Kit necesita internet para descargar el motor y tu lente. Conéctate, abre Caribe vía https (o el archivo en Chrome) e inténtalo de nuevo.', 'err');
    return;
  }
  arStatus('⏳ Descargando el motor de Snap Camera Kit…', '');
  try{
    if(!arSdk) arSdk = await import('https://esm.sh/@snap/camera-kit@1.22.0');
  }catch(err){
    arStatus('❌ No se pudo cargar el SDK — el AR requiere internet. Conéctate, abre Caribe vía https e intenta de nuevo.', 'err');
    return;
  }
  try{
    const { bootstrapCameraKit, createMediaStreamSource, Transform2D } = arSdk;
    const cameraKit = await bootstrapCameraKit({ apiToken: token });
    const canvas = $('#arCanvas');
    const session = await cameraKit.createSession({ liveRenderTarget: canvas });
    arSession = session;
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: creatorFlip ? 'user' : 'environment' }, audio: false
    });
    arStream = stream;
    const opts = creatorFlip
      ? { transform: Transform2D.MirrorX, cameraType: 'user' }
      : { cameraType: 'environment' };
    const source = createMediaStreamSource(stream, opts);
    await session.setSource(source);
    let lens = null;
    if(lensId){
      lens = await cameraKit.lensRepository.loadLens(lensId, group);
    } else {
      const { lenses } = await cameraKit.lensRepository.loadLensGroups([group]);
      lens = lenses && lenses[0];
      if(!lens) throw new Error('El grupo no devolvió lentes — revisa el Lens Group ID y que el lente esté enviado a Camera Kit.');
    }
    await session.applyLens(lens);
    await session.play();
    try{ localStorage.setItem(AR_KEY, JSON.stringify({ token, group, lensId })); }catch(_){}
    arSetLiveUI(true);
    $('#arSheet').classList.remove('open');
    $('#fxBrowser').classList.remove('open');
    arStatus('🟢 Lentes AR en vivo — estás viendo tu cámara real con el lente aplicado.', 'live');
    toast('✨ Lentes AR en vivo');
  }catch(err){
    console.warn('[Caribe AR]', err);
    try{ if(arSession){ if(arSession.pause) await arSession.pause(); if(arSession.destroy) await arSession.destroy(); } }catch(_){}
    if(arStream){ arStream.getTracks().forEach(t => t.stop()); arStream = null; }
    arSession = null;
    arSetLiveUI(false);
    const name = err && err.name;
    const msg = (name === 'NotAllowedError' || name === 'SecurityError')
      ? 'Permiso de cámara denegado — acéptalo en el navegador y reintenta.'
      : (err && err.message) ? err.message
      : 'error desconocido';
    arStatus('❌ No se pudo iniciar el AR: ' + msg, 'err');
    toast('Snap AR: no se pudo iniciar');
  }
}

/* ============================================================
   CÁMARA EN VIVO (getUserMedia) — enviar foto al chat
   ============================================================ */
let camStream = null, camFacing = 'environment', camShotData = null;
function stopCamStream(){ if(camStream){ camStream.getTracks().forEach(t => { try{ t.stop(); }catch(_){} }); camStream = null; } }
async function startCamStream(){
  stopCamStream();
  const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: camFacing, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
  camStream = stream;
  const v = $('#cameraVideo'); v.srcObject = stream; v.muted = true;
  try{ await v.play(); }catch(_){}
}
function setCamEditMode(editing){
  $('#cameraVideo').hidden = editing;
  $('#cameraShot').hidden = !editing;
  $('#cameraLiveUi').hidden = editing;
  $('#cameraEditUi').hidden = !editing;
}
async function openCamera(){
  camShotData = null; setCamEditMode(false);
  $('#cameraShot').removeAttribute('src');
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    $('#cameraInput').click();
    return;
  }
  $('#cameraOverlay').classList.add('open');
  $('#screen').classList.add('sb-light');
  try{ await startCamStream(); }
  catch(err){
    closeCamera();
    toast('Sin permiso de cámara — te abro el selector de fotos 📸');
    $('#cameraInput').click();
  }
}
function closeCamera(){
  stopCamStream();
  $('#cameraOverlay').classList.remove('open');
  $('#screen').classList.toggle('sb-light', $$('.page.active')[0] && $('.page.active').id === 'page-vibra');
}
$('#cameraClose').addEventListener('click', closeCamera);
$('#cameraFlip').addEventListener('click', async () => {
  camFacing = camFacing === 'environment' ? 'user' : 'environment';
  sndPop();
  try{ await startCamStream(); }catch(err){ toast('No pude voltear la cámara 🙈'); }
});
$('#cameraShutter').addEventListener('click', () => {
  const v = $('#cameraVideo');
  if(!v.videoWidth){ toast('La cámara aún está arrancando… ⏳'); return; }
  const maxW = 1280, scale = Math.min(1, maxW / v.videoWidth);
  const cv = document.createElement('canvas');
  cv.width = Math.round(v.videoWidth * scale); cv.height = Math.round(v.videoHeight * scale);
  cv.getContext('2d').drawImage(v, 0, 0, cv.width, cv.height);
  camShotData = cv.toDataURL('image/jpeg', 0.85);
  $('#cameraShot').src = camShotData;
  setCamEditMode(true);
  sndPop(); buzz(12);
});
$('#cameraRetake').addEventListener('click', () => { camShotData = null; setCamEditMode(false); sndPop(); });
$('#cameraSend').addEventListener('click', () => {
  if(!camShotData) return;
  const chat = curChat();
  if(!chat){ toast('Abre una conversación primero 🙏'); closeCamera(); return; }
  sendAndReply(chat, { d: 'out', img: '<img src="' + camShotData + '" alt="Foto">', text: '📷 Foto', time: nowTime() });
  camShotData = null;
  closeCamera();
  toast('📷 Foto enviada');
});

/* ============================================================
   PERFIL — círculo junto al ⋮, página tipo TikTok/IG, conectado
   con Vibra · Market · Negocios (caribe-me-v1 · caribe-follows-v1)
   ============================================================ */
const ME_KEY = 'caribe-me-v1', FOLLOWS_KEY = 'caribe-follows-v1';
const ME_PERSON = { id:'me', name:'Tú', handle:'@caribe', ini:'TÚ', color:'#0da271', bio:'', cat:'🌴 Caribe en línea', photo:null, verified:false, business:false, followers:0, following:0, likes:0 };
const PEOPLE = [ME_PERSON];
const _personCache = {};
const slugify = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '').slice(0, 16);
const initialsOf = n => (String(n || '?').trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase()) || '?';
function synthPerson(id, partial){
  if(_personCache[id]) return _personCache[id];
  const p = Object.assign({ id, name: id, handle: '@' + slugify(id), ini: initialsOf(id), color: '#64748b', bio: '', verified: false, business: false, followers: 180, following: 12, likes: 320 }, partial);
  _personCache[id] = p; return p;
}
function bizPerson(b){
  return synthPerson('biz:' + b.id, { name: b.name, handle: '@' + slugify(b.name), ini: b.emoji, color: (b.g && b.g[1]) || '#f97316', business: true, verified: !!b.verified, cat: b.catLbl ? '🏪 ' + b.catLbl : '🏪 Negocio local', followers: Math.round((b.reviews || 60) * 19), following: 8, likes: Math.round((b.reviews || 60) * 130), bio: (b.addr || '') + (b.city ? ', ' + b.city : '') + (b.delivery ? ' · Delivery 🚚' : ' · Recogida en tienda'), chatId: b.chatId });
}
function personFor(id){
  if(!id) return PEOPLE[0];
  if(id.indexOf('biz:') === 0){ const b = (typeof BUSINESSES !== 'undefined' ? BUSINESSES : []).find(x => x.id === id.slice(4)); return b ? bizPerson(b) : null; }
  if(id.indexOf('vib:') === 0 || id.indexOf('ext:') === 0){
    if(_personCache[id]) return _personCache[id];
    return null;
  }
  return PEOPLE.find(p => p.id === id) || null;
}
function personByHandle(h){
  if(!h) return null;
  const found = PEOPLE.find(p => p.handle === h);
  if(found) return found;
  return _personCache['vib:' + h] || null;
}
function personFromVibra(v){
  const found = PEOPLE.find(p => p.handle === v.handle);
  if(found) return found;

$('#pfEditPhotoBtn').addEventListener('click', () => $('#mePhotoInput').click());
$('#mePhotoInput').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0]; if(!f) return;
  const img = new Image();
  const url = URL.createObjectURL(f);
  img.onload = () => {
    const S = 320, scale = Math.min(1, S / Math.max(img.width, img.height));
    const cv = document.createElement('canvas');
    cv.width = Math.max(1, Math.round(img.width * scale)); cv.height = Math.max(1, Math.round(img.height * scale));
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    URL.revokeObjectURL(url);
    pendingPhoto = cv.toDataURL('image/jpeg', 0.82);
    editPhotoTouched = true;
    paintAvatar($('#pfEditAvatar'), { photo: pendingPhoto, ini: PEOPLE[0].ini, color: PEOPLE[0].color });
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast('No pude leer esa imagen 🙈'); };
  img.src = url;
  e.target.value = '';
});

function curChat(){ return getChat(state.currentChatId); }
function fmtSize(bytes){ return bytes > 1048576 ? (bytes / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(bytes / 1024)) + ' KB'; }
function sendAndReply(chat, m){
  appendMessage(chat, m);
  sndSend();
  closeSheets();
  if(chat.kind === 'online' && onlineMe){
    if(m.img){
      const src = m.raw || ((m.img.match(/src="([^"]+)"/) || [])[1] || '');
      if(src) onlineSendMessage({ to: chat.userId, kind: 'image', payload: src });
    } else if(m.audio && m.src){
      onlineSendMessage({ to: chat.userId, kind: 'audio', payload: m.src, dur: m.dur });
    } else if(m.text && m.text !== '📷 Foto'){
      onlineSendMessage({ to: chat.userId, kind: 'text', payload: m.text });
    } else {
      const what = m.contact ? 'contacto' : m.loc ? 'ubicación' : m.poll ? 'encuesta' : 'archivo';
      onlineSendMessage({ to: chat.userId, kind: 'text', payload: '📎 (' + what + ' compartido desde Caribe)' });
    }
    return;
  }
}

function sendChatFile(f){
  const chat = curChat(); if(!chat) return;
  if(!(f.type || '').startsWith('image')){
    sendAndReply(chat, { d: 'out', doc: { name: f.name, kind: (f.type || '').startsWith('video') ? 'VÍDEO' : 'ARCHIVO', meta: fmtSize(f.size) + ((f.type || '').startsWith('video') ? ' · video' : ' · archivo') }, time: nowTime() });
    return;
  }
  const reader = new FileReader();
  reader.onload = () => sendAndReply(chat, { d: 'out', img: '<img src="' + reader.result + '" alt="Foto">', text: '📷 Foto', time: nowTime() });
  reader.readAsDataURL(f);

/* Descargar mis datos (JSON real) */
function downloadMyData(){
  const dump = {};
  try{
    for(let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if(k && k.indexOf('caribe') === 0){ try{ dump[k] = JSON.parse(localStorage.getItem(k)); }catch(_){ dump[k] = localStorage.getItem(k); } }
    }
  }catch(_){}
  dump._app = 'Caribe v2.4.1';
  dump._exportedAt = new Date().toISOString();
  const blob = new Blob([JSON.stringify(dump, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'caribe-mis-datos.json';
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 4000);
  toast('⬇️ Descargando tus datos…');
}

/* QR del perfil */
function renderQrCard(){
  const me = PEOPLE[0];
  $('#stQrName').textContent = me.name;
  $('#stQrHandle').textContent = me.handle;
  const canvas = $('#stQrCanvas'); if(!canvas || typeof qrcode === 'undefined') return;
  try{
    const qr = qrcode(0, 'M');
    qr.addData(location.origin + location.pathname + '#' + String(me.handle || '').replace(/^@/, ''));
    qr.make();
    const count = qr.getModuleCount();
    const size = 172, quiet = 2, cell = Math.floor(size / (count + quiet * 2));
    const offset = Math.floor((size - count * cell) / 2);
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, size, size);
    ctx.fillStyle = '#111827';
    for(let r = 0; r < count; r++) for(let c = 0; c < count; c++) if(qr.isDark(r, c)) ctx.fillRect(offset + c * cell, offset + r * cell, cell, cell);
  }catch(_){ /* QR no disponible */ }
}

/* Cifrado */
function encCode(str){
  let h = 2166136261 >>> 0;
  const s = String(str);
  for(let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  const out = [];
  let x = h >>> 0;
  for(let i = 0; i < 60; i++){
    x = (Math.imul(x ^ (x >>> 13), 2246822519)) >>> 0;
    x = (x ^ (x >>> 16)) >>> 0;
    x = (Math.imul(x, 2654435761)) >>> 0;
    out.push(String(x % 10));
  }
  return out.join('').replace(/(.{5})/g, '$1 ').trim();
}
$('#ciEncBtn').addEventListener('click', () => {
  const chat = ciChat(); if(!chat) return;
  $('#ciEncName').textContent = chatDisplayName(chat);
  $('#ciEncCode').textContent = encCode(chat.id + '::' + chat.name);
  openSheet('sheetEncrypt'); sndPop();
});

});

/* ============================================================
   CARIBE EN LÍNEA — prueba multiusuario
   Registro obligatorio + amigos reales + mensajería en vivo
   ============================================================ */
const ONLINE_KEY = 'caribe-online-user';
let onlineMe = null;
let onlineLastTs = 0;
let onlineSilent = true;
let onlinePollTimer = null, onlinePingTimer = null, onlineUsersTimer = null;
const onlinePeers = new Map();
const onlineSeen = new Set();

function onlineApi(path, opts){
  const headers = { 'Content-Type': 'application/json' };
  if(onlineMe && onlineMe.token) headers.Authorization = 'Bearer ' + onlineMe.token;
  return fetch('/api' + path, Object.assign({ headers }, opts || {}))
    .then(r => r.json().catch(() => ({})).then(j => {
      if(r.status === 401 && path !== '/register') onlineSessionExpired();
      if(!r.ok) throw new Error(j.error || ('Error ' + r.status));
      return j;
    }));
}
function onlineSessionExpired(){
  if(!onlineMe) return;
  onlineMe = null;
  try{ localStorage.removeItem(ONLINE_KEY); }catch(_){}
  stopOnlineServices();
  showRegistration(true);
}
function colorForId(id){
  const palette = ['#0f9d8f','#7c5cfc','#a855f7','#f59e0b','#ec4899','#16a34a','#06b6d4','#e5484d','#8b5cf6'];
  let h = 0; const str = String(id);
  for(let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
  return palette[h % palette.length];
}
function noteOnlinePeers(users){
  (users || []).forEach(u => {
    const prev = onlinePeers.get(u.id) || {};
    onlinePeers.set(u.id, Object.assign(prev, u));
    const chat = state.chats.find(c => c.kind === 'online' && c.userId === u.id);
    if(chat){ chat.online = !!u.online; chat.name = u.name; chat.avatar = { t: initialsOf(u.name), c: colorForId(u.id) }; }
  });
  renderChats();
}
function onlineSendMessage(msg){
  if(!onlineMe) return;
  onlineApi('/messages', { method: 'POST', body: JSON.stringify(Object.assign({ from: onlineMe.id }, msg)) })
    .then(r => {
      if(r && r.message){
        if(r.message.id) onlineSeen.add(r.message.id);
        if(r.message.ts) onlineLastTs = Math.max(onlineLastTs, r.message.ts);
      }
    })
    .catch(err => toast('No se pudo enviar 😕 ' + (err.message || '')));
}
function ensureOnlineChat(peerId){
  let chat = state.chats.find(c => c.kind === 'online' && c.userId === peerId);
  if(chat) return chat;
  const peer = onlinePeers.get(peerId);
  if(!peer) refreshOnlineUsers();
  const name = peer ? peer.name : 'Amigo caribeño';
  chat = { id: 'on-' + peerId, kind: 'online', userId: peerId, name,
    avatar: { t: initialsOf(name), c: colorForId(peerId) }, time: 'ahora', unread: 0, out: false,
    preview: 'Di «hola» 👋', msgs: [], online: !!(peer && peer.online) };
  state.chats.unshift(chat);
  return chat;
}
function receiveOnlineMessage(msg, silent){
  if(!onlineMe) return;
  if(onlineSeen.has(msg.id)) return;
  onlineSeen.add(msg.id);
  const mine = msg.from === onlineMe.id;
  const peerId = mine ? msg.to : msg.from;
  const chat = ensureOnlineChat(peerId);
  const time = nowTime();
  let m;
  if(msg.kind === 'image') m = { d: mine ? 'out' : 'in', img: '<img src="' + msg.payload + '" alt="Foto">', text: '📷 Foto', time, src: msg.payload };
  else if(msg.kind === 'audio') m = { d: mine ? 'out' : 'in', audio: true, dur: msg.dur || 1, src: msg.payload, text: '🎤 Audio', time };
  else m = { d: mine ? 'out' : 'in', text: msg.payload, time };
  const convoOpen = state.currentChatId === chat.id && $('#convoOverlay').classList.contains('open');
  if(convoOpen || silent){
    chat.msgs.push(m);
    if(convoOpen){
      $('#messages').insertAdjacentHTML('beforeend', bubbleHTML(m, chat.msgs.length - 1));
      const box = $('#messages'); box.scrollTop = box.scrollHeight;
    }
    chat.preview = m.text || (msg.kind === 'image' ? '📷 Foto' : '🎤 Audio');
    chat.time = 'ahora'; chat.out = mine;
    renderChats();
    return;
  }
  chat.msgs.push(m);
  chat.preview = m.text || (msg.kind === 'image' ? '📷 Foto' : '🎤 Audio');
  chat.time = 'ahora'; chat.out = false; chat.unread = (chat.unread || 0) + 1;
  pushBanner(chat.name, chat.preview, () => { switchTab('page-chats'); openConvo(chat.id); });
  renderChats();
}
async function onlinePoll(){
  if(!onlineMe) return;
  try{
    const r = await onlineApi('/messages?me=' + encodeURIComponent(onlineMe.id) + '&since=' + onlineLastTs);
    const list = (r && r.messages) || [];
    list.sort((a, b) => a.ts - b.ts);
    list.forEach(msg => { onlineLastTs = Math.max(onlineLastTs, msg.ts); receiveOnlineMessage(msg, onlineSilent); });
  }catch(_){ /* sin conexión: reintenta */ }
  onlineSilent = false;
}
function onlinePing(){
  if(!onlineMe) return;
  onlineApi('/ping', { method: 'POST', body: JSON.stringify({ id: onlineMe.id }) }).catch(() => {});
}
function refreshOnlineUsers(){
  if(!onlineMe) return Promise.resolve();
  return onlineApi('/users?me=' + encodeURIComponent(onlineMe.id))
    .then(r => noteOnlinePeers(r.users || []))
    .catch(() => {});
}
let onlineStream = null;
function stopOnlineServices(){
  try{ leaveLive(); }catch(_){}
  clearInterval(onlinePingTimer); clearInterval(onlinePollTimer); clearInterval(onlineUsersTimer);
  if(onlineStream){ try{ onlineStream.close(); }catch(_){} onlineStream = null; }
}
function openOnlineStream(){
  if(!onlineMe || !onlineMe.token || typeof EventSource === 'undefined') return;
  if(onlineStream){ try{ onlineStream.close(); }catch(_){} }
  onlineStream = new EventSource('/api/stream?t=' + encodeURIComponent(onlineMe.token));
  onlineStream.addEventListener('message', ev => {              // mensaje nuevo, al instante
    try{
      const msg = JSON.parse(ev.data);
      onlineLastTs = Math.max(onlineLastTs, msg.ts || 0);
      receiveOnlineMessage(msg, false);
    }catch(_){}
  });
  onlineStream.addEventListener('feed', ev => { try{ handleFeedEvent(JSON.parse(ev.data)); }catch(_){} });
  onlineStream.addEventListener('signal', ev => { try{ handleLiveSignal(JSON.parse(ev.data)); }catch(_){} });
  onlineStream.addEventListener('live', ev => { try{ handleLiveEvent(JSON.parse(ev.data)); }catch(_){} });
  onlineStream.addEventListener('live-chat', ev => { try{ const m = JSON.parse(ev.data); if(live.role && m.hostId === live.hostId) addLiveComment(m.userId === onlineMe.id ? 'Tú' : m.name, colorForId(m.userId), m.text); }catch(_){} });
  onlineStream.addEventListener('live-heart', ev => { try{ const m = JSON.parse(ev.data); if(live.role && m.hostId === live.hostId) spawnFloatHeart(m.emoji); }catch(_){} });
  onlineStream.addEventListener('ready', () => { onlinePoll(); loadServerFeed(); refreshLiveNow(); });   // al (re)conectar, ponerse al día
}
function startOnlineServices(){
  stopOnlineServices();
  onlineSilent = true;
  onlinePing();
  Promise.resolve(refreshOnlineUsers()).then(() => { onlinePoll(); openOnlineStream(); });
  onlinePingTimer = setInterval(onlinePing, 25000);
  onlinePollTimer = setInterval(onlinePoll, 20000);               // respaldo; el tiempo real va por SSE
  onlineUsersTimer = setInterval(refreshOnlineUsers, 30000);
}

/* ---------- Feed real de Vibra (servidor) ---------- */
const vibraSaved = new Set();
function timeAgo(ts){
  const d = Math.max(0, Date.now() - ts) / 1000;
  if(d < 60) return 'ahora';
  if(d < 3600) return Math.floor(d / 60) + ' min';
  if(d < 86400) return Math.floor(d / 3600) + ' h';
  return Math.floor(d / 86400) + ' d';
}
function srvPostToVibra(p){
  const mine = !!(onlineMe && p.userId === onlineMe.id);
  const handle = '@' + (slugify(p.author) || 'caribe');
  const v = { id: p.id, srv: true, userId: p.userId, mine,
    img: p.img || null, fbEmoji: p.emoji || '🎬', fbGrad: p.grad || 'linear-gradient(160deg,#134e4a,#0f766e 55%,#f59e0b)',
    text: p.img ? '' : (p.text || ''), handle, time: timeAgo(p.ts), verified: false,
    likes: p.likes, comments: p.comments, liked: p.liked, saved: vibraSaved.has(p.id), following: p.following, cerca: true,
    caption: '<b>' + esc(p.caption || (p.img || p.text ? '' : 'Nuevo Vibra')) + '</b>',
    sub: '📍 ' + (p.country || 'Caribe') + (p.product ? ' · 🛍️ Vibra Shopping' : ''), tags: '',
    music: 'sonido original · ' + handle.slice(1), initials: initialsOf(p.author), product: null };
  if(!v.text && !v.img && p.text) v.text = p.text;
  if(p.product) v.product = { emoji: p.product.emoji, name: p.product.name, price: p.product.price,
    desc: 'Publicado con Vibra Shopping 🛍️ Escríbeme por el chat para coordinar entrega, pago contra entrega o recogida en el barrio.',
    seller: p.author, initials: initialsOf(p.author), color: colorForId(p.userId), rating: 'Nuevo en Vibra' };
  return v;
}
async function loadServerFeed(){
  if(!onlineMe || !onlineMe.token) return;
  try{
    const r = await onlineApi('/posts');
    state.vibra = (r.posts || []).map(srvPostToVibra);
    const f = $('#vibraFeed'), top = f ? f.scrollTop : 0;
    renderVibra();
    if(f) f.scrollTop = top;
  }catch(_){ /* sin conexión: se reintenta en el próximo evento */ }
}
function handleFeedEvent(ev){
  if(!ev) return;
  if(ev.type === 'post'){
    if(onlineMe && ev.by !== onlineMe.id){ loadServerFeed(); toast('✨ Nuevo Vibra en la comunidad'); }
    return;
  }
  const v = state.vibra.find(x => x.srv && x.id === ev.id); if(!v) return;
  if(ev.type === 'like' && ev.likes != null) v.likes = ev.likes;
  if(ev.type === 'comment' && ev.comments != null) v.comments = ev.comments;
  $$('#vibraFeed .slide').forEach(sl => {
    if(+sl.dataset.vibra !== v.id) return;
    const lc = sl.querySelector('.like-count'), cc = sl.querySelector('.comment-count');
    if(lc) lc.textContent = fmtNum(v.likes);
    if(cc) cc.textContent = fmtNum(v.comments);
  });
}
function compressImage(dataUrl, maxSide){
  return new Promise(resolve => {
    if(!dataUrl || dataUrl.indexOf('data:image') !== 0) return resolve(null);
    const im = new Image();
    im.onload = () => {
      const k = Math.min(1, maxSide / Math.max(im.width, im.height));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(im.width * k)); c.height = Math.max(1, Math.round(im.height * k));
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      resolve(c.toDataURL('image/jpeg', 0.82));
    };
    im.onerror = () => resolve(null);
    im.src = dataUrl;
  });
}
async function publishToServer(post){
  try{
    let img = null;
    if(post.img){ img = await compressImage(post.img, 1280); if(!img) throw new Error('No se pudo preparar la foto'); }
    const body = { caption: post.caption, text: post.text, img, emoji: post.emoji, grad: post.grad,
      product: post.product ? { name: post.product.name, price: post.product.price, emoji: post.product.emoji } : null };
    await onlineApi('/posts', { method: 'POST', body: JSON.stringify(body) });
    await loadServerFeed();
    const f = $('#vibraFeed'); if(f) f.scrollTo({ top: 0 });
    toast(post.product ? '¡Vibra publicado con tu producto! 🛍️' : '¡Vibra publicado! 🎬'); sndPop();
  }catch(err){ toast('No se pudo publicar 😕 ' + (err.message || '')); }
}

/* ---------- Registro obligatorio ---------- */
function showRegistration(show){
  $('#regOverlay').classList.toggle('hidden', !show);
}
$('#regCountry').addEventListener('change', e => {
  const opt = e.target.options[e.target.selectedIndex];
  $('#regDial').textContent = opt.dataset.dial || '+1';
});
$('#regForm').addEventListener('submit', async e => {
  e.preventDefault();
  const name = $('#regName').value.trim().replace(/\s+/g, ' ');
  const sel = $('#regCountry');
  const country = sel.value;
  const dial = sel.options[sel.selectedIndex].dataset.dial || '+1';
  const phone = $('#regPhone').value.trim();
  const errEl = $('#regError');
  errEl.textContent = '';
  if(name.length < 3){ errEl.textContent = 'Escribe tu nombre completo.'; return; }
  if(phone.replace(/[^\d]/g, '').length < 6){ errEl.textContent = 'Escribe un número válido (mínimo 6 dígitos).'; return; }
  const btn = $('#regSubmit');
  btn.disabled = true;
  btn.textContent = 'Creando tu cuenta…';
  try{
    const r = await onlineApi('/register', { method: 'POST', body: JSON.stringify({ name, country, dial, phone }) });
    onlineMe = Object.assign({}, r.user, { token: r.token });
    try{ localStorage.setItem(ONLINE_KEY, JSON.stringify(onlineMe)); }catch(_){}
    syncMeFromRegistration();
    showRegistration(false);
    sndReceive();
    toast('¡Bienvenido, ' + (onlineMe.name.split(' ')[0] || 'amigo') + '! 🌴');
    startOnlineServices();
  }catch(err){
    errEl.textContent = err.message || 'No se pudo crear tu cuenta. Revisa tu conexión.';
    btn.disabled = false;
    btn.textContent = 'Crear mi cuenta';
  }
});

/* ---------- Mi perfil ← registro ---------- */
function syncMeFromRegistration(){
  const n = (onlineMe && onlineMe.name ? onlineMe.name : '').trim();
  if(n){
    ME_PERSON.name = n;
    ME_PERSON.handle = '@' + (slugify(n) || 'caribe');
    ME_PERSON.ini = initialsOf(n);
    if(onlineMe.country) ME_PERSON.cat = '📍 ' + onlineMe.country;
  }
  try{
    $$('.me-chip-av').forEach(el => { el.textContent = ME_PERSON.ini; });
  }catch(_){}
  try{ renderMeChips(); }catch(_){}
}

/* ---------- Arranque de Caribe en línea ---------- */
try{ onlineMe = JSON.parse(localStorage.getItem(ONLINE_KEY) || 'null'); }catch(_){ onlineMe = null; }
function bootOnline(){
  if(onlineMe && !onlineMe.token){ onlineMe = null; try{ localStorage.removeItem(ONLINE_KEY); }catch(_){} }  // sesión de la v2
  if(onlineMe && onlineMe.id){
    syncMeFromRegistration();
    showRegistration(false);
    startOnlineServices();
    return;
  }
  if(location.protocol === 'file:'){                        // sin servidor (abierto como archivo) → sin chat en línea
    showRegistration(false);
    toast('Abre el enlace de Caribe en el teléfono para chatear');
    return;
  }
  fetch('/api/health', { cache: 'no-store' })
    .then(r => { if(!r.ok) throw new Error('api'); return r.json(); })
    .then(() => showRegistration(true))                    // servidor presente → registro obligatorio
    .catch(() => {                                          // sin servidor (preview estático / offline)
      showRegistration(false);
      toast('Sin conexión con el servidor — abre el enlace de Caribe 📡');
    });
}
bootOnline();

/* ---------- PWA: instalar como app (solo https/localhost) ---------- */
if('serviceWorker' in navigator && location.protocol !== 'file:'){
  const swHadController = !!navigator.serviceWorker.controller;
  let swReloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {      // llegó una versión nueva → recargar una vez
    if(!swHadController || swReloaded) return;
    if(typeof live !== 'undefined' && live.role) return;                    // no cortar un live en curso
    swReloaded = true; location.reload();
  });
  window.addEventListener('load', () => { try{ navigator.serviceWorker.register('/sw.js').catch(() => {}); }catch(_){} });
}
